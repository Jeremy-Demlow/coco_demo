name: reconciliation_360
description: >
  Semantic model for Reconciliation Management System providing comprehensive views
  of entity-level reconciliation status, balances, and variance analysis for
  financial close and compliance workflows.

tables:
  - name: entity_360
    description: >
      Entity-level 360 view providing comprehensive reconciliation metrics per 
      organization entity per period. Includes balances, variance analysis, and risk indicators.
    base_table:
      database: DBAPI_REPLICA_DB
      schema: PUBLIC_MARTS
      table: ENTITY_360
    
    dimensions:
      - name: entity_id
        synonyms:
          - organization id
          - org id
          - company id
        description: Unique identifier for the organization entity
        expr: entity_id
        data_type: NUMBER
        unique: true

      - name: entity_code
        synonyms:
          - org code
          - company code
          - entity number
        description: Business code for the entity
        expr: entity_code
        data_type: VARCHAR

      - name: entity_name
        synonyms:
          - organization name
          - company name
          - org name
        description: Display name of the entity
        expr: entity_name
        data_type: VARCHAR

      - name: period_id
        description: Reconciliation period identifier
        expr: period_id
        data_type: NUMBER

      - name: period_year
        synonyms:
          - year
          - fiscal year
        description: Year of the reconciliation period
        expr: period_year
        data_type: NUMBER

      - name: period_quarter
        synonyms:
          - quarter
          - fiscal quarter
        description: Quarter of the reconciliation period (1-4)
        expr: period_quarter
        data_type: NUMBER
        is_enum: true

      - name: period_month_num
        synonyms:
          - month
          - month number
        description: Month number of the reconciliation period (1-12)
        expr: period_month_num
        data_type: NUMBER
        is_enum: true

      - name: variance_risk_level
        synonyms:
          - risk level
          - variance risk
          - risk category
        description: Risk classification based on variance amount (High Risk, Medium Risk, Low Risk, No Variance)
        expr: variance_risk_level
        data_type: VARCHAR
        is_enum: true
        sample_values:
          - High Risk
          - Medium Risk
          - Low Risk
          - No Variance

    time_dimensions:
      - name: period_end_date
        synonyms:
          - period date
          - close date
          - end date
        description: End date of the reconciliation period
        expr: period_end_date
        data_type: DATE

    facts:
      - name: total_assignments
        synonyms:
          - assignment count
          - number of assignments
        description: Total number of reconciliation assignments for this entity/period
        expr: total_assignments
        data_type: NUMBER

      - name: active_assignments
        synonyms:
          - active count
          - active reconciliations
        description: Number of currently active assignments
        expr: active_assignments
        data_type: NUMBER

      - name: assignments_with_activity
        description: Number of assignments with activity in the period
        expr: assignments_with_activity
        data_type: NUMBER

      - name: key_account_count
        synonyms:
          - key accounts
          - important accounts
        description: Number of key accounts for this entity/period
        expr: key_account_count
        data_type: NUMBER

      - name: total_gl_balance
        synonyms:
          - gl balance
          - general ledger balance
        description: Total general ledger balance in local currency
        expr: total_gl_balance
        data_type: NUMBER

      - name: total_gl_balance_base
        synonyms:
          - gl balance base currency
        description: Total general ledger balance in base currency
        expr: total_gl_balance_base
        data_type: NUMBER

      - name: total_bank_balance
        synonyms:
          - bank balance
          - cash balance
        description: Total bank balance in local currency
        expr: total_bank_balance
        data_type: NUMBER

      - name: total_bank_balance_base
        description: Total bank balance in base currency
        expr: total_bank_balance_base
        data_type: NUMBER

      - name: total_subledger_balance
        synonyms:
          - subledger balance
        description: Total subledger balance in local currency
        expr: total_subledger_balance
        data_type: NUMBER

      - name: total_variance
        synonyms:
          - variance amount
          - total difference
        description: Total variance amount for the period
        expr: total_variance
        data_type: NUMBER

      - name: total_absolute_variance
        synonyms:
          - absolute variance
          - variance magnitude
        description: Sum of absolute variance values
        expr: total_absolute_variance
        data_type: NUMBER

      - name: variance_count
        synonyms:
          - number of variances
        description: Count of variance records
        expr: variance_count
        data_type: NUMBER

      - name: over_variance_count
        description: Count of variances where actual exceeded expected
        expr: over_variance_count
        data_type: NUMBER

      - name: under_variance_count
        description: Count of variances where actual was below expected
        expr: under_variance_count
        data_type: NUMBER

      - name: max_single_variance
        synonyms:
          - largest variance
          - maximum variance
        description: Largest single variance amount
        expr: max_single_variance
        data_type: NUMBER

      - name: active_assignment_pct
        synonyms:
          - active percentage
          - completion rate
        description: Percentage of assignments that are active
        expr: active_assignment_pct
        data_type: NUMBER

      - name: activity_coverage_pct
        synonyms:
          - activity coverage
          - coverage percentage
        description: Percentage of assignments with activity
        expr: activity_coverage_pct
        data_type: NUMBER

    metrics:
      - name: total_entities
        synonyms:
          - entity count
          - number of entities
        description: Count of distinct entities
        expr: COUNT(DISTINCT entity_id)

      - name: sum_gl_balance
        synonyms:
          - total gl
          - aggregate gl balance
        description: Sum of all GL balances across entities
        expr: SUM(total_gl_balance)

      - name: sum_bank_balance
        synonyms:
          - total bank
          - aggregate bank balance
        description: Sum of all bank balances across entities
        expr: SUM(total_bank_balance)

      - name: sum_variance
        synonyms:
          - total variance
          - aggregate variance
        description: Sum of all variances across entities
        expr: SUM(total_variance)

      - name: sum_absolute_variance
        synonyms:
          - total absolute variance
        description: Sum of all absolute variances across entities
        expr: SUM(total_absolute_variance)

      - name: avg_gl_balance
        synonyms:
          - average gl balance
        description: Average GL balance per entity
        expr: AVG(total_gl_balance)

      - name: avg_variance
        synonyms:
          - average variance
        description: Average variance per entity
        expr: AVG(total_variance)

      - name: high_risk_entity_count
        synonyms:
          - high risk count
          - risky entities
        description: Count of entities with high variance risk
        expr: SUM(CASE WHEN variance_risk_level = 'High Risk' THEN 1 ELSE 0 END)

      - name: total_assignments_sum
        synonyms:
          - all assignments
        description: Total assignments across all entities
        expr: SUM(total_assignments)

      - name: total_active_assignments
        synonyms:
          - all active assignments
        description: Total active assignments across all entities
        expr: SUM(active_assignments)

    filters:
      - name: high_risk_only
        synonyms:
          - high risk
          - risky
        description: Filter to high risk entities only
        expr: variance_risk_level = 'High Risk'

      - name: has_variance
        synonyms:
          - with variance
          - variance exists
        description: Filter to entities with any variance
        expr: variance_count > 0

      - name: current_year
        description: Filter to current year data
        expr: period_year = YEAR(CURRENT_DATE())

  - name: reconciliation_fact
    description: >
      Detailed fact table for individual reconciliations with assignment, entity, 
      and period context. Includes balance comparisons and reconciliation status.
    base_table:
      database: DBAPI_REPLICA_DB
      schema: PUBLIC_MARTS
      table: RECONCILIATION_FACT

    dimensions:
      - name: reconciliation_id
        description: Unique identifier for the reconciliation record
        expr: reconciliation_id
        data_type: NUMBER
        unique: true

      - name: assignment_id
        description: Assignment identifier linking to account/entity
        expr: assignment_id
        data_type: NUMBER

      - name: entity_id
        synonyms:
          - organization id
          - company id
        description: Organization entity identifier
        expr: entity_id
        data_type: NUMBER

      - name: entity_code
        synonyms:
          - org code
          - company code
        description: Business code for the entity
        expr: entity_code
        data_type: VARCHAR

      - name: entity_name
        synonyms:
          - organization name
          - company name
        description: Display name of the entity
        expr: entity_name
        data_type: VARCHAR

      - name: entity_parent_name
        synonyms:
          - parent organization
          - parent company
        description: Name of the parent entity
        expr: entity_parent_name
        data_type: VARCHAR

      - name: assignment_key
        description: Business key for the assignment
        expr: assignment_key
        data_type: VARCHAR

      - name: assignment_type
        synonyms:
          - type
          - recon type
        description: Type of assignment
        expr: assignment_type
        data_type: VARCHAR

      - name: account_combination
        synonyms:
          - account combo
          - gl account
        description: Account combination string
        expr: account_combination
        data_type: VARCHAR

      - name: currency
        synonyms:
          - currency code
        description: Currency of the reconciliation
        expr: currency
        data_type: VARCHAR
        is_enum: true

      - name: reconciliation_type
        synonyms:
          - recon type
        description: Type of reconciliation
        expr: reconciliation_type
        data_type: VARCHAR

      - name: reconciliation_status
        synonyms:
          - status
          - recon status
        description: Calculated status (Reconciled, Minor Difference, Needs Review)
        expr: reconciliation_status
        data_type: VARCHAR
        is_enum: true
        sample_values:
          - Reconciled
          - Minor Difference
          - Needs Review

      - name: period_year
        synonyms:
          - year
        description: Year of the period
        expr: period_year
        data_type: NUMBER

      - name: period_quarter
        synonyms:
          - quarter
        description: Quarter of the period
        expr: period_quarter
        data_type: NUMBER
        is_enum: true

      - name: period_month_num
        synonyms:
          - month
        description: Month number of the period
        expr: period_month_num
        data_type: NUMBER
        is_enum: true

      - name: segment1
        description: Account segment 1
        expr: segment1
        data_type: VARCHAR

      - name: segment2
        description: Account segment 2
        expr: segment2
        data_type: VARCHAR

      - name: segment3
        description: Account segment 3
        expr: segment3
        data_type: VARCHAR

    time_dimensions:
      - name: period_end_date
        synonyms:
          - period date
          - close date
        description: End date of the reconciliation period
        expr: period_end_date
        data_type: DATE

    facts:
      - name: balance_bank
        synonyms:
          - bank balance
        description: Bank balance in local currency
        expr: balance_bank
        data_type: NUMBER

      - name: balance_bank_base
        description: Bank balance in base currency
        expr: balance_bank_base
        data_type: NUMBER

      - name: balance_calculated
        synonyms:
          - calculated balance
        description: Calculated balance in local currency
        expr: balance_calculated
        data_type: NUMBER

      - name: balance_calculated_base
        description: Calculated balance in base currency
        expr: balance_calculated_base
        data_type: NUMBER

      - name: balance_subledger
        synonyms:
          - subledger balance
        description: Subledger balance in local currency
        expr: balance_subledger
        data_type: NUMBER

      - name: balance_subledger_base
        description: Subledger balance in base currency
        expr: balance_subledger_base
        data_type: NUMBER

      - name: amount_unidentified
        synonyms:
          - unidentified amount
          - unknown amount
        description: Unidentified amount in the reconciliation
        expr: amount_unidentified
        data_type: NUMBER

      - name: bank_calc_diff
        synonyms:
          - bank calculated difference
          - bank vs calculated
        description: Difference between bank and calculated balance
        expr: bank_calc_diff
        data_type: NUMBER

      - name: bank_subledger_diff
        synonyms:
          - bank subledger difference
        description: Difference between bank and subledger balance
        expr: bank_subledger_diff
        data_type: NUMBER

    metrics:
      - name: total_reconciliations
        synonyms:
          - recon count
          - reconciliation count
        description: Total count of reconciliations
        expr: COUNT(*)

      - name: sum_bank_balance
        synonyms:
          - total bank balance
        description: Sum of bank balances
        expr: SUM(balance_bank)

      - name: sum_calculated_balance
        synonyms:
          - total calculated balance
        description: Sum of calculated balances
        expr: SUM(balance_calculated)

      - name: sum_subledger_balance
        synonyms:
          - total subledger balance
        description: Sum of subledger balances
        expr: SUM(balance_subledger)

      - name: sum_unidentified
        synonyms:
          - total unidentified
        description: Sum of unidentified amounts
        expr: SUM(amount_unidentified)

      - name: sum_bank_calc_diff
        synonyms:
          - total difference
        description: Sum of bank vs calculated differences
        expr: SUM(bank_calc_diff)

      - name: avg_bank_balance
        description: Average bank balance
        expr: AVG(balance_bank)

      - name: reconciled_count
        synonyms:
          - reconciled
        description: Count of fully reconciled items
        expr: SUM(CASE WHEN reconciliation_status = 'Reconciled' THEN 1 ELSE 0 END)

      - name: needs_review_count
        synonyms:
          - needs review
          - review needed
        description: Count of items needing review
        expr: SUM(CASE WHEN reconciliation_status = 'Needs Review' THEN 1 ELSE 0 END)

      - name: reconciliation_rate
        synonyms:
          - recon rate
          - completion rate
        description: Percentage of items that are fully reconciled
        expr: SUM(CASE WHEN reconciliation_status = 'Reconciled' THEN 1 ELSE 0 END) * 100.0 / NULLIF(COUNT(*), 0)

    filters:
      - name: needs_review
        synonyms:
          - review required
        description: Filter to reconciliations needing review
        expr: reconciliation_status = 'Needs Review'

      - name: reconciled_only
        description: Filter to fully reconciled items
        expr: reconciliation_status = 'Reconciled'

      - name: has_unidentified
        description: Filter to items with unidentified amounts
        expr: amount_unidentified != 0

relationships:
  - name: reconciliation_to_entity
    left_table: reconciliation_fact
    right_table: entity_360
    relationship_columns:
      - left_column: entity_id
        right_column: entity_id
      - left_column: period_id
        right_column: period_id

verified_queries:
  - name: high_risk_entities
    question: Which entities have high variance risk?
    use_as_onboarding_question: true
    sql: |
      SELECT entity_name, entity_code, period_year, period_quarter, 
             total_variance, total_absolute_variance, variance_risk_level
      FROM entity_360
      WHERE variance_risk_level = 'High Risk'
      ORDER BY total_absolute_variance DESC

  - name: reconciliation_summary_by_status
    question: What is the reconciliation status breakdown?
    use_as_onboarding_question: true
    sql: |
      SELECT reconciliation_status, COUNT(*) as count,
             SUM(balance_bank) as total_bank_balance,
             SUM(ABS(bank_calc_diff)) as total_difference
      FROM reconciliation_fact
      GROUP BY reconciliation_status
      ORDER BY count DESC

  - name: entity_balance_summary
    question: What are the total balances by entity?
    use_as_onboarding_question: true
    sql: |
      SELECT entity_name, period_year, period_quarter,
             total_gl_balance, total_bank_balance, total_subledger_balance,
             total_variance
      FROM entity_360
      ORDER BY total_gl_balance DESC

  - name: monthly_variance_trend
    question: How has variance changed over time?
    sql: |
      SELECT period_year, period_month_num, period_end_date,
             SUM(total_variance) as total_variance,
             SUM(total_absolute_variance) as total_absolute_variance,
             COUNT(DISTINCT entity_id) as entity_count
      FROM entity_360
      GROUP BY period_year, period_month_num, period_end_date
      ORDER BY period_year, period_month_num

  - name: top_variance_entities
    question: Which entities have the largest variances?
    sql: |
      SELECT entity_name, entity_code, period_end_date,
             total_variance, total_absolute_variance, variance_risk_level
      FROM entity_360
      WHERE variance_count > 0
      ORDER BY total_absolute_variance DESC
      LIMIT 20
