name: reconciliation_360
description: "Comprehensive 360-degree view of financial reconciliation data including entities, assignments, periods, variances, and reconciliation status"

tables:
  - name: entity_360
    description: "Entity-level 360 view with aggregated reconciliation metrics by period"
    base_table:
      database: COCO_LIVE_DB
      schema: DBT_MARTS
      table: ENTITY_360
    dimensions:
      - name: entity_id
        synonyms: ["entity identifier", "org id"]
        description: "Unique identifier for the organization entity"
        expr: entity_id
        data_type: NUMBER
        unique: true
      - name: entity_code
        synonyms: ["entity number", "org code"]
        description: "Business code for the entity"
        expr: entity_code
        data_type: VARCHAR
      - name: entity_name
        synonyms: ["organization name", "company name", "entity"]
        description: "Name of the organization entity"
        expr: entity_name
        data_type: VARCHAR
      - name: entity_type
        synonyms: ["organization type", "entity category"]
        description: "Type classification of the entity"
        expr: entity_type
        data_type: NUMBER
        is_enum: true
      - name: parent_name
        synonyms: ["parent entity", "parent organization"]
        description: "Name of the parent entity in the hierarchy"
        expr: parent_name
        data_type: VARCHAR
      - name: hierarchy_depth
        synonyms: ["org level", "hierarchy level"]
        description: "Depth level in the organization hierarchy"
        expr: hierarchy_depth
        data_type: NUMBER
      - name: variance_risk_level
        synonyms: ["risk level", "variance risk", "risk category"]
        description: "Risk classification based on variance amount (High/Medium/Low)"
        expr: variance_risk_level
        data_type: VARCHAR
        is_enum: true
        sample_values: ["High", "Medium", "Low"]
    time_dimensions:
      - name: period_end_date
        synonyms: ["period date", "close date", "reconciliation date"]
        description: "End date of the reconciliation period"
        expr: period_end_date
        data_type: DATE
      - name: period_year
        synonyms: ["year", "fiscal year"]
        description: "Year of the reconciliation period"
        expr: period_year
        data_type: NUMBER
      - name: period_quarter
        synonyms: ["quarter", "fiscal quarter"]
        description: "Quarter of the reconciliation period (1-4)"
        expr: period_quarter
        data_type: NUMBER
      - name: period_month_num
        synonyms: ["month", "period month"]
        description: "Month number of the reconciliation period (1-12)"
        expr: period_month_num
        data_type: NUMBER
    facts:
      - name: total_assignments
        synonyms: ["assignment count", "number of assignments"]
        description: "Total number of reconciliation assignments for the entity"
        expr: total_assignments
        data_type: NUMBER
      - name: active_assignments
        synonyms: ["active count", "in-progress assignments"]
        description: "Number of currently active assignments"
        expr: active_assignments
        data_type: NUMBER
      - name: total_balance_gl
        synonyms: ["gl balance", "general ledger balance"]
        description: "Total general ledger balance"
        expr: total_balance_gl
        data_type: NUMBER
      - name: total_balance_bank
        synonyms: ["bank balance", "cash balance"]
        description: "Total bank balance"
        expr: total_balance_bank
        data_type: NUMBER
      - name: total_variance
        synonyms: ["variance amount", "total variance"]
        description: "Total absolute variance amount"
        expr: total_variance
        data_type: NUMBER
      - name: total_reconciliations
        synonyms: ["reconciliation count", "number of reconciliations"]
        description: "Total number of reconciliation records"
        expr: total_reconciliations
        data_type: NUMBER
      - name: total_unreconciled_amount
        synonyms: ["unreconciled balance", "outstanding amount"]
        description: "Total amount remaining unreconciled"
        expr: total_unreconciled_amount
        data_type: NUMBER
      - name: assignment_completion_rate
        synonyms: ["completion percentage", "completion rate"]
        description: "Percentage of assignments completed"
        expr: assignment_completion_rate
        data_type: NUMBER
      - name: ownership_percentage
        synonyms: ["ownership", "ownership pct"]
        description: "Ownership percentage of the entity"
        expr: ownership_percentage
        data_type: NUMBER
    metrics:
      - name: sum_total_variance
        synonyms: ["aggregate variance", "total variance sum"]
        description: "Sum of all variance amounts"
        expr: SUM(total_variance)
      - name: sum_unreconciled
        synonyms: ["total unreconciled", "aggregate unreconciled"]
        description: "Sum of all unreconciled amounts"
        expr: SUM(total_unreconciled_amount)
      - name: avg_completion_rate
        synonyms: ["average completion", "mean completion rate"]
        description: "Average assignment completion rate"
        expr: AVG(assignment_completion_rate)
      - name: count_entities
        synonyms: ["entity count", "number of entities"]
        description: "Count of distinct entities"
        expr: COUNT(DISTINCT entity_id)
      - name: count_high_risk_entities
        synonyms: ["high risk count", "risky entities"]
        description: "Count of entities with high variance risk"
        expr: COUNT(CASE WHEN variance_risk_level = 'High' THEN 1 END)
      - name: sum_gl_balance
        synonyms: ["total gl", "aggregate gl balance"]
        description: "Sum of general ledger balances"
        expr: SUM(total_balance_gl)
      - name: sum_bank_balance
        synonyms: ["total bank", "aggregate bank balance"]
        description: "Sum of bank balances"
        expr: SUM(total_balance_bank)
    filters:
      - name: high_risk_only
        synonyms: ["high risk filter", "risky only"]
        description: "Filter to show only high variance risk entities"
        expr: "variance_risk_level = 'High'"
      - name: has_unreconciled
        synonyms: ["unreconciled filter", "outstanding only"]
        description: "Filter to show entities with unreconciled amounts"
        expr: "total_unreconciled_amount > 0"

  - name: assignment_360
    description: "Assignment-level 360 view with detailed reconciliation and variance data"
    base_table:
      database: COCO_LIVE_DB
      schema: DBT_MARTS
      table: ASSIGNMENT_360
    dimensions:
      - name: assignment_id
        synonyms: ["assignment identifier", "assignment number"]
        description: "Unique identifier for the reconciliation assignment"
        expr: assignment_id
        data_type: NUMBER
        unique: true
      - name: assignment_type
        synonyms: ["type", "assignment category"]
        description: "Type of assignment (Balance, Flux, Activity)"
        expr: assignment_type
        data_type: VARCHAR
        is_enum: true
        sample_values: ["Balance", "Flux", "Activity"]
      - name: combo_name
        synonyms: ["combination name", "account combo"]
        description: "Account combination name"
        expr: combo_name
        data_type: VARCHAR
      - name: currency
        synonyms: ["currency code", "transaction currency"]
        description: "Currency of the assignment"
        expr: currency
        data_type: VARCHAR
        is_enum: true
      - name: segment1
        synonyms: ["segment 1", "account segment 1"]
        description: "First account segment"
        expr: segment1
        data_type: VARCHAR
      - name: segment2
        synonyms: ["segment 2", "account segment 2"]
        description: "Second account segment"
        expr: segment2
        data_type: VARCHAR
      - name: segment3
        synonyms: ["segment 3", "account segment 3"]
        description: "Third account segment"
        expr: segment3
        data_type: VARCHAR
      - name: entity_name
        synonyms: ["organization", "company"]
        description: "Name of the associated entity"
        expr: entity_name
        data_type: VARCHAR
      - name: entity_code
        synonyms: ["entity number", "org code"]
        description: "Code of the associated entity"
        expr: entity_code
        data_type: VARCHAR
      - name: status
        synonyms: ["assignment status", "current status"]
        description: "Current status of the assignment (Active/Inactive)"
        expr: status
        data_type: VARCHAR
        is_enum: true
        sample_values: ["Active", "Inactive"]
      - name: variance_risk
        synonyms: ["risk level", "variance risk level"]
        description: "Variance risk classification (High/Medium/Low)"
        expr: variance_risk
        data_type: VARCHAR
        is_enum: true
        sample_values: ["High", "Medium", "Low"]
      - name: reconciliation_status
        synonyms: ["recon status", "reconciliation state"]
        description: "Current reconciliation status"
        expr: reconciliation_status
        data_type: VARCHAR
        is_enum: true
        sample_values: ["Needs Review", "Pending", "On Track", "Complete"]
    time_dimensions:
      - name: period_end_date
        synonyms: ["period date", "close date"]
        description: "End date of the reconciliation period"
        expr: period_end_date
        data_type: DATE
      - name: period_year
        synonyms: ["year", "fiscal year"]
        description: "Year of the reconciliation period"
        expr: period_year
        data_type: NUMBER
      - name: period_quarter
        synonyms: ["quarter", "fiscal quarter"]
        description: "Quarter of the reconciliation period"
        expr: period_quarter
        data_type: NUMBER
    facts:
      - name: balance_gl
        synonyms: ["gl balance", "general ledger"]
        description: "General ledger balance"
        expr: balance_gl
        data_type: NUMBER
      - name: balance_bank
        synonyms: ["bank balance", "cash balance"]
        description: "Bank balance"
        expr: balance_bank
        data_type: NUMBER
      - name: balance_subledger
        synonyms: ["subledger balance", "subsidiary balance"]
        description: "Subledger balance"
        expr: balance_subledger
        data_type: NUMBER
      - name: total_variance
        synonyms: ["variance", "variance amount"]
        description: "Total variance amount"
        expr: total_variance
        data_type: NUMBER
      - name: unreconciled_amount
        synonyms: ["unreconciled", "outstanding balance"]
        description: "Unreconciled amount"
        expr: unreconciled_amount
        data_type: NUMBER
      - name: reconciliation_count
        synonyms: ["recon count", "number of reconciliations"]
        description: "Count of reconciliation records"
        expr: reconciliation_count
        data_type: NUMBER
    metrics:
      - name: sum_gl_balance
        synonyms: ["total gl", "aggregate gl"]
        description: "Sum of GL balances"
        expr: SUM(balance_gl)
      - name: sum_bank_balance
        synonyms: ["total bank", "aggregate bank"]
        description: "Sum of bank balances"
        expr: SUM(balance_bank)
      - name: sum_variance
        synonyms: ["total variance", "aggregate variance"]
        description: "Sum of variance amounts"
        expr: SUM(total_variance)
      - name: sum_unreconciled
        synonyms: ["total unreconciled", "aggregate unreconciled"]
        description: "Sum of unreconciled amounts"
        expr: SUM(unreconciled_amount)
      - name: count_assignments
        synonyms: ["assignment count", "total assignments"]
        description: "Count of assignments"
        expr: COUNT(DISTINCT assignment_id)
      - name: count_high_risk
        synonyms: ["high risk count", "risky assignments"]
        description: "Count of high variance risk assignments"
        expr: COUNT(CASE WHEN variance_risk = 'High' THEN 1 END)
      - name: count_needs_review
        synonyms: ["review count", "needs attention"]
        description: "Count of assignments needing review"
        expr: COUNT(CASE WHEN reconciliation_status = 'Needs Review' THEN 1 END)
      - name: avg_variance
        synonyms: ["average variance", "mean variance"]
        description: "Average variance amount"
        expr: AVG(total_variance)
    filters:
      - name: active_only
        synonyms: ["active filter", "active assignments only"]
        description: "Filter to show only active assignments"
        expr: "status = 'Active'"
      - name: needs_review
        synonyms: ["review filter", "attention needed"]
        description: "Filter for assignments needing review"
        expr: "reconciliation_status = 'Needs Review'"
      - name: high_variance
        synonyms: ["high risk filter"]
        description: "Filter for high variance assignments"
        expr: "variance_risk = 'High'"

relationships:
  - name: assignment_to_entity
    left_table: assignment_360
    right_table: entity_360
    relationship_columns:
      - left_column: entity_id
        right_column: entity_id
      - left_column: period_id
        right_column: period_id

verified_queries:
  - name: top_entities_by_variance
    question: "Which entities have the highest variance?"
    use_as_onboarding_question: true
    sql: |
      SELECT entity_name, period_end_date, total_variance, variance_risk_level
      FROM COCO_LIVE_DB.DBT_MARTS.ENTITY_360
      WHERE total_variance > 0
      ORDER BY total_variance DESC
      LIMIT 10

  - name: unreconciled_by_period
    question: "What is the total unreconciled amount by period?"
    use_as_onboarding_question: true
    sql: |
      SELECT period_end_date, SUM(total_unreconciled_amount) AS total_unreconciled
      FROM COCO_LIVE_DB.DBT_MARTS.ENTITY_360
      GROUP BY period_end_date
      ORDER BY period_end_date DESC

  - name: high_risk_assignments
    question: "Show me all high risk assignments"
    use_as_onboarding_question: true
    sql: |
      SELECT assignment_id, entity_name, combo_name, total_variance, reconciliation_status
      FROM COCO_LIVE_DB.DBT_MARTS.ASSIGNMENT_360
      WHERE variance_risk = 'High'
      ORDER BY total_variance DESC

  - name: entity_completion_rates
    question: "What are the completion rates by entity?"
    sql: |
      SELECT entity_name, period_end_date, assignment_completion_rate, active_assignments, total_assignments
      FROM COCO_LIVE_DB.DBT_MARTS.ENTITY_360
      ORDER BY assignment_completion_rate ASC

  - name: assignments_needing_review
    question: "Which assignments need review?"
    use_as_onboarding_question: true
    sql: |
      SELECT assignment_id, entity_name, combo_name, unreconciled_amount, variance_risk
      FROM COCO_LIVE_DB.DBT_MARTS.ASSIGNMENT_360
      WHERE reconciliation_status = 'Needs Review'
      ORDER BY unreconciled_amount DESC
