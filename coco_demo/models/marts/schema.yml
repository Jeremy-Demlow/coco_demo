version: 2

models:
  - name: entity_360
    description: >
      Entity-level 360 view providing comprehensive reconciliation metrics 
      per organization entity per period. Includes balances, variance analysis, 
      and risk indicators.
    columns:
      - name: entity_id
        description: Unique identifier for the organization entity
        tests:
          - not_null
      - name: entity_code
        description: Business code for the entity
      - name: entity_name
        description: Display name of the entity
      - name: period_id
        description: Reconciliation period identifier
        tests:
          - not_null
      - name: total_assignments
        description: Total number of reconciliation assignments for this entity/period
      - name: active_assignments
        description: Number of currently active assignments
      - name: variance_risk_level
        description: Risk classification based on variance amount (High/Medium/Low/None)

  - name: reconciliation_fact
    description: >
      Detailed fact table for individual reconciliations with assignment,
      entity, and period context. Includes balance comparisons and status.
    columns:
      - name: reconciliation_id
        description: Unique identifier for the reconciliation record
        tests:
          - not_null
      - name: reconciliation_status
        description: Calculated status based on bank vs calculated difference
