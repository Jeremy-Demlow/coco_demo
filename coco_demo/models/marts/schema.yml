version: 2

models:
  - name: mart_entity_360
    description: >
      Comprehensive 360-degree view of each organizational entity including 
      reconciliation status, variance analysis, and health scoring.
    columns:
      - name: entity_id
        description: Unique identifier for the entity
        tests:
          - unique
          - not_null
      - name: entity_code
        description: Business code for the entity
      - name: entity_name
        description: Display name of the entity
      - name: entity_health_status
        description: Overall health status (Critical, At Risk, Healthy, Needs Attention, No Activity)

  - name: mart_variance_summary
    description: >
      Period-by-period variance analysis summary by entity for trend analysis
      and risk monitoring.

  - name: semantic_entity_360
    description: >
      Snowflake Semantic View for the Entity 360 model. Enables natural language 
      queries via Cortex Analyst about entity health, reconciliation status, 
      and variance analysis. Use with: COCO_LIVE_DB.PUBLIC.SEMANTIC_ENTITY_360

  - name: mart_anomaly_features
    description: >
      Feature store view for variance anomaly detection ML models. Contains 
      engineered features including z-scores, historical statistics, period-over-period
      changes, and anomaly labels for supervised/unsupervised learning.
    columns:
      - name: assignment_id
        description: Assignment identifier
      - name: period_id
        description: Period identifier  
      - name: gl_balance_zscore
        description: Z-score of GL balance relative to assignment history
      - name: variance_zscore
        description: Z-score of variance relative to assignment history
      - name: abs_variance_zscore
        description: Z-score of absolute variance
      - name: is_anomaly_label
        description: Binary label (1 if Critical/High severity variance, 0 otherwise)
