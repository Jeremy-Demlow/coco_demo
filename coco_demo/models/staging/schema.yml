version: 2

sources:
  - name: replica
    database: DBAPI_REPLICA_DB
    schema: CUSTOMER_A_DATA
    description: PostgreSQL CDC replication data for reconciliation management
    tables:
      - name: rec_periods
        description: Reconciliation periods (monthly)
      - name: rec_assignments
        description: Account/entity assignment records
      - name: rec_reconciliations
        description: Individual reconciliation records
      - name: rec_period_information
        description: Period-level status and balances per assignment
      - name: org_entities
        description: Organization units (companies, cost centers)
      - name: users
        description: System users
      - name: var_activity
        description: Variance tracking and history
      - name: comment_details
        description: Comments on reconciliations

models:
  - name: stg_rec_periods
    description: Staged reconciliation periods with date dimensions
  - name: stg_rec_assignments
    description: Staged reconciliation assignments with cleaned fields
  - name: stg_rec_reconciliations
    description: Staged reconciliation records
  - name: stg_rec_period_information
    description: Staged period-level reconciliation status
  - name: stg_org_entities
    description: Staged organization entities
  - name: stg_users
    description: Staged user records
  - name: stg_var_activity
    description: Staged variance activity records
